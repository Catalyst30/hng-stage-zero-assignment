<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile Card — Stage 0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <article class="profile-card" data-testid="test-profile-card" aria-labelledby="profile-name">
      <header class="profile-header">
        <figure class="avatar-figure" aria-hidden="false">
          <img src="https://via.placeholder.com/160" alt="User avatar" data-testid="test-user-avatar" id="avatarImg" />
          <figcaption class="visually-hidden">User avatar</figcaption>
        </figure>

        <div class="profile-meta">
          <h2 id="profile-name" data-testid="test-user-name">Alex Example</h2>
          <p class="bio" data-testid="test-user-bio">
            Frontend tinkerer, chess fan, and coffee enthusiast. I build small, testable UI components with accessibility in mind.
          </p>

          <p class="time-line">
            Current time (ms): <time data-testid="test-user-time" id="timeNow">0</time>
          </p>

          <nav aria-label="Social links" class="social" data-testid="test-user-social-links">
            <ul>
              <li><a href="https://twitter.com" target="_blank" rel="noopener noreferrer" data-testid="test-user-social-twitter">Twitter</a></li>
              <li><a href="https://github.com" target="_blank" rel="noopener noreferrer" data-testid="test-user-social-github">GitHub</a></li>
              <li><a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" data-testid="test-user-social-linkedin">LinkedIn</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <section class="controls" aria-label="Avatar controls">
        <label for="avatarUrl">Avatar URL:</label>
        <input type="url" id="avatarUrl" placeholder="https://example.com/me.jpg" aria-label="Avatar URL" />

        <label for="avatarFile">Upload avatar (image):</label>
        <input type="file" id="avatarFile" accept="image/*" aria-label="Upload avatar" />
      </section>

      <section class="hobbies" aria-labelledby="hobbies-heading" data-testid="test-user-hobbies">
        <h3 id="hobbies-heading">Hobbies</h3>
        <ul>
          <li>Chess</li>
          <li>Hiking</li>
          <li>Photography</li>
        </ul>
      </section>

      <section class="dislikes" aria-labelledby="dislikes-heading" data-testid="test-user-dislikes">
        <h3 id="dislikes-heading">Dislikes</h3>
        <ul>
          <li>Bad UX</li>
          <li>Slow CI</li>
          <li>Unreadable code</li>
        </ul>
      </section>
    </article>
  </main>

  <script src="app.js"></script>
</body>
</html>
